<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота №4</title>
    <link rel="stylesheet" href="PR4.css">
</head>
<body>

    <h1>Практична робота №4</h1>
    <p class="subtitle">Повнорозмірна клавіатура</p>

    <main class="keyboard">

        <div class="function-row">
            <button class="key special">Esc</button>
            <button class="key">F1</button>
            <button class="key">F2</button>
            <button class="key">F3</button>
            <button class="key">F4</button>
            <button class="key">F5</button>
            <button class="key">F6</button>
            <button class="key">F7</button>
            <button class="key">F8</button>
            <button class="key">F9</button>
            <button class="key">F10</button>
            <button class="key">F11</button>
            <button class="key">F12</button>
        </div>

        <div class="keyboard-body">

            <section class="typing-area">

                <div class="key-row">
                    <button class="key">~<small>`</small></button>
                    <button class="key">!<small>1</small></button>
                    <button class="key">@<small>2</small></button>
                    <button class="key">#<small>3</small></button>
                    <button class="key">$<small>4</small></button>
                    <button class="key">%<small>5</small></button>
                    <button class="key">^<small>6</small></button>
                    <button class="key">&amp;<small>7</small></button>
                    <button class="key">*<small>8</small></button>
                    <button class="key">(<small>9</small></button>
                    <button class="key">)<small>0</small></button>
                    <button class="key">_<small>-</small></button>
                    <button class="key">+<small>=</small></button>
                    <button class="key wide special">Backspace</button>
                </div>

                <div class="key-row">
                    <button class="key wide special">Tab</button>
                    <button class="key">Q</button>
                    <button class="key">W</button>
                    <button class="key">E</button>
                    <button class="key">R</button>
                    <button class="key">T</button>
                    <button class="key">Y</button>
                    <button class="key">U</button>
                    <button class="key">I</button>
                    <button class="key">O</button>
                    <button class="key">P</button>
                    <button class="key">[</button>
                    <button class="key">]</button>
                    <button class="key wide">\</button>
                </div>

                <div class="key-row">
                    <button class="key extra-wide special">Caps Lock</button>
                    <button class="key">A</button>
                    <button class="key">S</button>
                    <button class="key">D</button>
                    <button class="key">F</button>
                    <button class="key">G</button>
                    <button class="key">H</button>
                    <button class="key">J</button>
                    <button class="key">K</button>
                    <button class="key">L</button>
                    <button class="key">;</button>
                    <button class="key">'</button>
                    <button class="key extra-wide special">Enter</button>
                </div>

                <div class="key-row">
                    <button class="key shift special">Shift</button>
                    <button class="key">\</button>
                    <button class="key">Z</button>
                    <button class="key">X</button>
                    <button class="key">C</button>
                    <button class="key">V</button>
                    <button class="key">B</button>
                    <button class="key">N</button>
                    <button class="key">M</button>
                    <button class="key">,</button>
                    <button class="key">.</button>
                    <button class="key">/</button>
                    <button class="key shift special">Shift</button>
                </div>

                <div class="key-row bottom-row">
                    <button class="key special">Ctrl</button>
                    <button class="key special">Win</button>
                    <button class="key special">Alt</button>
                    <button class="key space"></button>
                    <button class="key special">Alt</button>
                    <button class="key special">Fn</button>
                    <button class="key special">Menu</button>
                    <button class="key special">Ctrl</button>
                </div>

            </section>

            <section class="navigation">

                <div class="nav-row">
                    <button class="key special">PrtSc</button>
                    <button class="key special">ScrLk</button>
                    <button class="key special">Pause</button>
                </div>

                <div class="nav-row">
                    <button class="key special">Insert</button>
                    <button class="key special">Home</button>
                    <button class="key special">PgUp</button>
                </div>

                <div class="nav-row">
                    <button class="key special">Delete</button>
                    <button class="key special">End</button>
                    <button class="key special">PgDn</button>
                </div>

                <div class="arrows">
                    <button class="key special up">↑</button>
                    <button class="key special left">←</button>
                    <button class="key special down">↓</button>
                    <button class="key special right">→</button>
                </div>

            </section>

            <section class="numpad">

                <button class="key special">Num</button>
                <button class="key">/</button>
                <button class="key">*</button>
                <button class="key">-</button>

                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key tall">+</button>

                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>

                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key tall enter">Enter</button>

                <button class="key zero">0</button>
                <button class="key">.</button>

            </section>

        </div>

    </main>

    <footer>
        Виконав: Рєзнік Д. В., група ТЦР-21
    </footer>

</body>
</html>
