
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тижневий план</title>
    <link rel="stylesheet" href="lab4.css">
</head>
<body>

<div class="planner">

    <header class="header">
        <div class="title">
            <h1>ТИЖНЕВИЙ ПЛАН</h1>
        </div>

        <div class="week">
            <label>ТИЖДЕНЬ З</label>
            <input type="text">
        </div>

        <div class="habit">
            <label>ЗДОРОВА ЗВИЧКА</label>
            <input type="text">
        </div>

        <div class="checks">
            <label>
                <input type="checkbox">
                ВСЕ ВДАЛОСЯ
            </label>

            <label>
                <input type="checkbox">
                Є ЩО ПОКРАЩИТИ
            </label>
        </div>
    </header>

    <aside class="sidebar">

        <section>
            <h3>3 ГОЛОВНІ ЦІЛІ</h3>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>
        </section>

        <section>
            <h3>УСЕ ІНШЕ</h3>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>
        </section>

        <section>
            <h3>НАСТУПНИЙ ТИЖДЕНЬ</h3>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>

            <div class="task">
                <input type="checkbox">
                <input type="text">
            </div>
        </section>

    </aside>

    <section class="day monday">
        <h3>ПОНЕДІЛОК</h3>
        <input type="checkbox">
        <textarea></textarea>
    </section>

    <section class="day tuesday">
        <h3>ВІВТОРОК</h3>
        <input type="checkbox">
        <textarea></textarea>
    </section>

    <section class="day wednesday">
        <h3>СЕРЕДА</h3>
        <input type="checkbox">
        <textarea></textarea>
    </section>

    <section class="day thursday">
        <h3>ЧЕТВЕР</h3>
        <input type="checkbox">
        <textarea></textarea>
    </section>

    <section class="day friday">
        <h3>П'ЯТНИЦЯ</h3>
        <input type="checkbox">
        <textarea></textarea>
    </section>

    <div class="weekend">

        <section class="day saturday">
            <h3>СУБОТА</h3>
            <input type="checkbox">
            <textarea></textarea>
        </section>

        <section class="day sunday">
            <h3>НЕДІЛЯ</h3>
            <input type="checkbox">
            <textarea></textarea>
        </section>

    </div>

    <footer></footer>

</div>

</body>
</html>
